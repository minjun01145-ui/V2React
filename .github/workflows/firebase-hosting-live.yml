name: Deploy Firebase Hosting (live)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Firebase Web identifiers are public configuration. Keep them pinned to the
      # same project that receives this workflow's Hosting and backend deployments.
      VITE_FIREBASE_API_KEY: AIzaSyAhXLWCpfmWJc-nd4R6k47QKGFFGxG4NJg
      VITE_FIREBASE_AUTH_DOMAIN: v2react-jurye-classroom.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: v2react-jurye-classroom
      VITE_FIREBASE_STORAGE_BUCKET: v2react-jurye-classroom.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "842692628205"
      VITE_FIREBASE_APP_ID: "1:842692628205:web:d45c0c28be6d4fe73486e4"
      VITE_ADMIN_AUTH_EMAIL: ${{ secrets.VITE_ADMIN_AUTH_EMAIL }}
      VITE_FIREBASE_FUNCTIONS_REGION: ${{ secrets.VITE_FIREBASE_FUNCTIONS_REGION }}
      VITE_DEFAULT_ROOM_ID: ${{ secrets.VITE_DEFAULT_ROOM_ID }}
      VITE_FIREBASE_APP_CHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APP_CHECK_SITE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment environment
        shell: bash
        run: |
          required=(
            VITE_FIREBASE_API_KEY
            VITE_FIREBASE_AUTH_DOMAIN
            VITE_FIREBASE_PROJECT_ID
            VITE_FIREBASE_STORAGE_BUCKET
            VITE_FIREBASE_MESSAGING_SENDER_ID
            VITE_FIREBASE_APP_ID
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing Firebase build configuration: ${missing[*]}"
            exit 1
          fi

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_V2REACT_JURYE_CLASSROOM }}
          channelId: live
          projectId: v2react-jurye-classroom
