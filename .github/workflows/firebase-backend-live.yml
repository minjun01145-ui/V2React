name: Deploy Firebase Backend (live)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-backend-live
  cancel-in-progress: false

jobs:
  test_rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm install --global firebase-tools@15.28.1
      - name: Test Firestore and Realtime Database rules in isolated emulators
        run: npm run test:rules

  deploy_firestore_rules:
    needs: test_and_deploy_functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_V2REACT_JURYE_CLASSROOM }}

      - name: Deploy Firestore rules
        run: >-
          npx --yes firebase-tools@15.28.1 deploy
          --only "firestore:rules"
          --project v2react-jurye-classroom
          --non-interactive

      - name: Deploy Realtime Database rules
        run: >-
          npx --yes firebase-tools@15.28.1 deploy
          --only "database"
          --project v2react-jurye-classroom
          --non-interactive

  test_and_deploy_functions:
    needs: test_rules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Test Functions
        run: npm test --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_V2REACT_JURYE_CLASSROOM }}

      - name: Deploy the grading worker before accepting asynchronous answers
        run: >-
          npx --yes firebase-tools@15.28.1 deploy
          --only "functions:jurye-v2:gradeSlideQuestionResponse"
          --project v2react-jurye-classroom
          --non-interactive
          --force

      - name: Deploy Functions
        run: >-
          npx --yes firebase-tools@15.28.1 deploy
          --only "functions:jurye-v2"
          --project v2react-jurye-classroom
          --non-interactive
