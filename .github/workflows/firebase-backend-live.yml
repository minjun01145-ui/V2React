name: Deploy Firebase Backend (live)

on:
  push:
    branches: [main]
    paths:
      - functions/**
      - security/firestore.rules.secure
      - firebase.json
      - .firebaserc
      - .github/workflows/firebase-backend-live.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-backend-live
  cancel-in-progress: false

jobs:
  test_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Test Functions
        run: npm test --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_V2REACT_JURYE_CLASSROOM }}

      - name: Deploy Functions and Firestore rules
        run: >-
          npx --yes firebase-tools@15.28.1 deploy
          --only "functions:jurye-v2,firestore:rules"
          --project v2react-jurye-classroom
          --non-interactive
